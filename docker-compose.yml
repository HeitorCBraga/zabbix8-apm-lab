networks:
  default:
    name: zabbix8-internal
  agrofield-observability:
    external: true

volumes:
  zabbix_postgres_data:
  clickhouse_data:

services:
  postgres-zabbix:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    volumes:
      - zabbix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: zabbix
      CLICKHOUSE_PASSWORD: zabbix
      CLICKHOUSE_DB: zabbix_telemetry
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:trunk-alpine
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres-zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      ZBX_STARTTELEMETRYQUERYPOLLERS: 1
      ZBX_TELEMETRYPROVIDER_0: '{"provider":"clickhouse","url":"http://clickhouse:8123","db":"zabbix_telemetry","username":"zabbix","password":"zabbix"}'
    depends_on:
      postgres-zabbix:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - default
      - agrofield-observability

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:trunk-alpine
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres-zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      - zabbix-server
    networks:
      - default

  zabbix-proxy:
    image: zabbix/zabbix-proxy-sqlite3:trunk-alpine
    restart: unless-stopped
    user: "0:0" # necessário para o hook de entrypoint poder editar zabbix_proxy.conf (root-owned)
    environment:
      ZBX_HOSTNAME: zabbix-proxy
      ZBX_SERVER_HOST: zabbix-server
      ZBX_PROXYMODE: 0
      ZBX_STARTTELEMETRYQUERYPOLLERS: 1
      ZBX_TELEMETRYPROVIDER_0: '{"provider":"clickhouse","url":"http://clickhouse:8123","db":"zabbix_telemetry","username":"zabbix","password":"zabbix"}'
    # Confirmado na prática: o entrypoint (trunk, rc2) NÃO reconhece ZBX_STARTAPMCOLLECTORS /
    # ZBX_APMLISTENIP / ZBX_APMLISTENPORT como env vars (ainda não implementadas no gerador de
    # config, embora o binário já suporte --with-apm). Habilitamos via hook de entrypoint, que
    # roda depois da geração da config e antes do zabbix_proxy iniciar.
    volumes:
      - ./proxy-entrypoint.d:/etc/zabbix/entrypoint.d:ro
    ports:
      - "10051:10051"
      - "4317:4317"
    depends_on:
      zabbix-server:
        condition: service_started
      clickhouse:
        condition: service_healthy
    networks:
      - default
      - agrofield-observability
